name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x gh-runners tests/test_*.sh tests/mock/*
      - name: tests
        run: |
          bash tests/test_gh_runners.sh
          bash tests/test_local.sh

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nixfmt
        run: nix fmt -- --check flake.nix
      - name: flake check
        run: nix flake check -L
