name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck gh-runners
      - name: tests
        run: |
          python3 tests/test_gh_runners.py
          python3 tests/test_local.py

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nixfmt
        run: nix fmt -- --check flake.nix
      - name: flake check
        run: nix flake check -L
